version: '3.9'

# ============================================================
# DEVELOPMENT COMPOSE — hot-reload, live source mounts
# For production use: docker-compose -f docker-compose.prod.yml up
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: fintel_db
    environment:
      POSTGRES_DB: fintel
      POSTGRES_USER: fintel
      POSTGRES_PASSWORD: fintel_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fintel_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintel_backend
    environment:
      DATABASE_URL: postgresql://fintel:fintel_secret@db:5432/fintel
      REDIS_URL: redis://redis:6379
      SEC_EDGAR_BASE_URL: https://data.sec.gov
      ENVIRONMENT: development
      ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data_lake:/data_lake
    # --reload is intentional here for development hot-reload
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintel_frontend
    environment:
      # NEXT_PUBLIC_API_URL is embedded in the browser bundle at build time.
      # In dev, the user's browser reaches the backend at localhost:8000.
      # For remote/production deployments set this to the public backend URL.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintel_scheduler
    environment:
      DATABASE_URL: postgresql://fintel:fintel_secret@db:5432/fintel
      REDIS_URL: redis://redis:6379
      SEC_EDGAR_BASE_URL: https://data.sec.gov
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data_lake:/data_lake
    command: python -m pipelines.scheduler

volumes:
  postgres_data:
  redis_data:
