version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: fintel_db
    environment:
      POSTGRES_DB: fintel
      POSTGRES_USER: fintel
      POSTGRES_PASSWORD: fintel_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fintel_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintel_backend
    environment:
      DATABASE_URL: postgresql://fintel:fintel_secret@db:5432/fintel
      REDIS_URL: redis://redis:6379
      SEC_EDGAR_BASE_URL: https://data.sec.gov
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./data_lake:/data_lake
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintel_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintel_scheduler
    environment:
      DATABASE_URL: postgresql://fintel:fintel_secret@db:5432/fintel
      REDIS_URL: redis://redis:6379
      SEC_EDGAR_BASE_URL: https://data.sec.gov
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data_lake:/data_lake
    command: python -m pipelines.scheduler

volumes:
  postgres_data:
  redis_data:
